<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta name="author" content="Clear Prop Games">
<meta name="theme-color" content="#14213d">
<script>
// ---- Audio: contexts, background handling, and the looping music layers ----
// 1. Browsers keep an AudioContext suspended until a user gesture. Every context the page or the engine makes is remembered
//    here and resumed on the first tap / key.
// 2. When the page goes to the background (tab hidden, phone locked, app switched: visibilitychange, pagehide, blur) EVERY
//    context is suspended at once, even before the game is ready. They stay suspended after the page is visible again: the
//    game (which pauses itself and mutes its Master bus) releases them when the player taps Resume (window.__pwRelease).
//    If the game is not up yet, the first tap after coming back resumes them.
// 3. PWAudio plays the looping layers (the music layers, the engine beds, wind and rain) natively: AudioBufferSource loops run on the browser's audio
//    thread, so a busy phone cannot leave a gap at the loop point (the engine's own web loops restart from the main thread).
(function () {
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) { return; }
  var all = [];
  window.__ctxs = all;
  window.__pwHidden = false;
  window.__pwGameReady = false;
  var held = false;
  function Wrapped() {
    var c = new (Function.prototype.bind.apply(Ctor, [null].concat([].slice.call(arguments))))();
    all.push(c);
    if (held) { try { c.suspend(); } catch (e) {} }
    return c;
  }
  Wrapped.prototype = Ctor.prototype;
  window.AudioContext = Wrapped;
  if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
  function suspendAll() { all.forEach(function (c) { if (c.state === 'running') { try { c.suspend(); } catch (e) {} } }); }
  function resumeAll() { all.forEach(function (c) { if (c.state === 'suspended') { try { c.resume(); } catch (e) {} } }); }
  function hide() { window.__pwHidden = true; held = true; suspendAll(); }
  function show() { if (!document.hidden) { window.__pwHidden = false; } }
  document.addEventListener('visibilitychange', function () { if (document.hidden) { hide(); } else { show(); } });
  window.addEventListener('pagehide', hide);
  window.addEventListener('blur', hide);
  window.addEventListener('focus', show);
  window.addEventListener('pageshow', show);
  window.__pwRelease = function () { held = false; resumeAll(); };
  function gesture() {
    if (document.hidden || window.__pwHidden) { return; }
    if (held) { if (window.__pwGameReady) { return; } held = false; }
    resumeAll();
  }
  ['touchend', 'pointerup', 'click', 'keydown', 'mouseup'].forEach(function (ev) { window.addEventListener(ev, gesture, { capture: true }); });

  var api = { enabled: false };
  window.PWAudio = api;
  var ctx;
  try { ctx = new window.AudioContext({ latencyHint: 'playback' }); } catch (e) { try { ctx = new window.AudioContext(); } catch (e2) { return; } }
  ctx.__pw = true;
  window.__pwCtx = ctx;
  var master = ctx.createGain();
  var limiter = ctx.createDynamicsCompressor();          // a gentle limiter on everything the page plays
  limiter.threshold.value = -4; limiter.knee.value = 3; limiter.ratio.value = 20; limiter.attack.value = 0.003; limiter.release.value = 0.12;
  master.connect(limiter); limiter.connect(ctx.destination);
  var names = ['calm', 'hot', 'tense', 'engine_cub', 'engine_172', 'engine_twin', 'engine_jet', 'wind', 'rain'];
  var gains = {}, want = {}, bufs = {}, left = names.length, started = false, loopStart = 0;
  names.forEach(function (n) { gains[n] = ctx.createGain(); gains[n].gain.value = 0; gains[n].connect(master); want[n] = -80; });
  function lin(db) { return db <= -70 ? 0 : Math.pow(10, db / 20); }
  function apply(n) { gains[n].gain.setTargetAtTime(lin(want[n]), ctx.currentTime, 0.04); }
  function startAll() {
    var t0 = ctx.currentTime + 0.1;
    loopStart = t0;
    names.forEach(function (n) { var s = ctx.createBufferSource(); s.buffer = bufs[n]; s.loop = true; s.connect(gains[n]); s.start(t0); });
    started = true;
    names.forEach(apply);
  }
  names.forEach(function (n) {
    fetch('audio/' + n + '.wav').then(function (r) { return r.arrayBuffer(); }).then(function (b) { return ctx.decodeAudioData(b); }).then(function (buf) {
      bufs[n] = buf; left--; if (left === 0) { startAll(); }
    }).catch(function () { api.enabled = false; });
  });
  api.enabled = true;
  api.set = function (n, db) { if (!(n in want)) { return; } want[n] = db; if (started) { apply(n); } };
  api.setMany = function (o) { for (var k in o) { api.set(k, o[k]); } };
  // Seconds into the music's 6 s loop (-1 until it runs): (the game can line sounds up with the music).
  api.phase = function () { if (!started) { return -1; } var p = (ctx.currentTime - loopStart) % 6; return p < 0 ? p + 6 : p; };
  api.setHeld = function (b) { master.gain.setTargetAtTime(b ? 0 : 1, ctx.currentTime, 0.015); };
})();
</script>
$GODOT_HEAD_INCLUDE
<title>$GODOT_PROJECT_NAME</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #fff; background: #14213d; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
/* The loading screen: brand background, the Clear Prop Games propeller, a progress bar. Nothing else. */
#loader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 38%, #1d3157 0%, #14213d 62%, #0e182d 100%); transition: opacity .45s ease; font-family: ui-rounded, "Arial Rounded MT Bold", "Nunito", "Segoe UI", system-ui, sans-serif; }
#loader.done { opacity: 0; pointer-events: none; }
#mark { width: min(34vw, 190px); height: min(34vw, 190px); animation: spin 1.1s linear infinite; filter: drop-shadow(0 8px 16px rgba(3,8,20,.45)); }
@keyframes spin { to { transform: rotate(360deg); } }
#word { margin-top: 28px; font-size: clamp(26px, 7.4vw, 44px); font-weight: 800; letter-spacing: .01em; color: #fff; text-shadow: 0 3px 0 #0a1020; }
#bar { margin-top: 30px; width: min(60vw, 340px); height: 14px; border-radius: 9px; background: #0a1020; box-shadow: inset 0 0 0 2px rgba(160,184,230,.35); overflow: hidden; }
#fill { height: 100%; width: 6%; border-radius: 9px; background: linear-gradient(#5aa0ff, #3d8bff); transition: width .25s ease; }
#fill.wait { width: 40%; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
#note { margin-top: 22px; font-size: 17px; color: #bcd0ec; text-align: center; max-width: 80vw; min-height: 22px; }
</style>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Greaser needs JavaScript.</noscript>
<div id="loader">
  <svg id="mark" viewBox="-100 -100 200 200" aria-hidden="true">
    <g fill="#3d8bff" stroke="#0a1020" stroke-width="5" stroke-linejoin="round">
      <path id="blade" d="M -9 4 C -22 -26 -18 -72 0 -92 C 18 -72 22 -26 9 4 Z"/>
      <use href="#blade" transform="rotate(120)"/>
      <use href="#blade" transform="rotate(240)"/>
    </g>
    <circle r="24" fill="#0a1020"/><circle r="17" fill="#ffc933"/><circle r="6" fill="#c98a0b"/>
  </svg>
  <div id="word">Clear Prop Games</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="note"></div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const loader = document.getElementById('loader');
	const fill = document.getElementById('fill');
	const note = document.getElementById('note');
	let hidden = false;
	/* The game calls this when its first screen is ready (after its own warm-up), so the player never sees it set up. */
	window.gameReady = function () {
		if (hidden) { return; }
		hidden = true;
		loader.classList.add('done');
		setTimeout(function () { loader.remove(); }, 600);
	};
	function fail(err) {
		console.error(err);
		document.getElementById('mark').style.animation = 'none';
		fill.className = '';
		fill.style.background = '#ff5c4d';
		fill.style.width = '100%';
		note.textContent = 'Could not start the game. Please reload the page.';
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('missing features: ' + missing.join(', '));
		return;
	}
	fill.className = 'wait';
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.className = '';
				fill.style.width = Math.max(6, Math.round(current / total * 92)) + '%';
			} else {
				fill.className = 'wait';
			}
		},
	}).then(function () {
		fill.className = '';
		fill.style.width = '96%';      /* the engine is up; the game finishes its warm-up, then calls gameReady() */
		setTimeout(window.gameReady, 30000);     /* safety net only */
	}, fail);
}());
</script>
</body>
</html>
